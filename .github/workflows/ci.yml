name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW
        run: brew install glfw

      - name: Build (release)
        run: make release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffeezz-macos
          path: dist/release/coffeezz

  # ── Test ───────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW (for header)
        run: brew install glfw

      - name: Run tests
        run: make test

  # ── Release (rolling "latest" on every main push) ──────────────────
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: coffeezz-macos
          path: dist/release

      - name: Make executable
        run: chmod +x dist/release/coffeezz

      - name: Force-push rolling 'latest' tag
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Rolling release — always the latest commit on `main`."
          files: dist/release/coffeezz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
